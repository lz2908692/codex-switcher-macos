name: Build macOS (M-chip + Intel)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            suffix: "M-chip"
          - runner: macos-13
            suffix: "Intel"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pyinstaller pillow

      - name: Generate macOS icon
        id: icon
        continue-on-error: true
        run: |
          python3 generate_icon.py
          iconutil -c icns icon.iconset -o susu_icon.icns
          ls -la susu_icon.icns
          echo "icon_file=susu_icon.icns" >> $GITHUB_OUTPUT

      - name: Build with PyInstaller
        run: |
          ICON_ARG=""
          if [ -f "susu_icon.icns" ]; then
            ICON_ARG="--icon susu_icon.icns"
          fi
          pyinstaller \
            --onefile \
            --windowed \
            --name "CodexSwitcher-${{ matrix.suffix }}" \
            $ICON_ARG \
            --distpath dist \
            --workpath build \
            --specpath . \
            codex_switcher_macos.py

      - name: List output
        run: |
          ls -la dist/
          find dist/ -type f | head -20

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CodexSwitcher-macOS-${{ matrix.suffix }}
          path: dist/
          retention-days: 30
