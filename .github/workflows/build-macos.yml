name: Build macOS (M-chip + Intel via Rosetta)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rosetta 2
        run: |
          softwareupdate --install-rosetta --agree-to-license 2>/dev/null || true

      - name: Set up Python (ARM64)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (ARM64)
        run: |
          pip install pyinstaller pillow

      - name: Generate macOS icon
        id: icon
        continue-on-error: true
        run: |
          python3 generate_icon.py
          iconutil -c icns icon.iconset -o susu_icon.icns
          ls -la susu_icon.icns

      - name: Build ARM64 (M-chip) version
        run: |
          ICON_ARG=""
          if [ -f "susu_icon.icns" ]; then
            ICON_ARG="--icon susu_icon.icns"
          fi
          pyinstaller \
            --onefile \
            --windowed \
            --name "CodexSwitcher-M-chip" \
            $ICON_ARG \
            --distpath dist-arm64 \
            --workpath build-arm64 \
            --specpath . \
            codex_switcher_macos.py
          ls -la dist-arm64/

      - name: Set up Python (x86_64 via Rosetta)
        run: |
          # Install x86_64 Python via Homebrew under Rosetta
          arch -x86_64 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)" 2>/dev/null || true
          # Use x86_64 homebrew to install python
          arch -x86_64 /usr/local/bin/brew install python@3.12 2>/dev/null || true
          # Create x86_64 venv
          arch -x86_64 /usr/local/opt/python@3.12/bin/python3.12 -m venv x86_venv
          arch -x86_64 x86_venv/bin/pip install --upgrade pip
          arch -x86_64 x86_venv/bin/pip install pyinstaller pillow

      - name: Build x86_64 (Intel) version
        run: |
          ICON_ARG=""
          if [ -f "susu_icon.icns" ]; then
            ICON_ARG="--icon susu_icon.icns"
          fi
          arch -x86_64 x86_venv/bin/python -m PyInstaller \
            --onefile \
            --windowed \
            --name "CodexSwitcher-Intel" \
            $ICON_ARG \
            --distpath dist-x86_64 \
            --workpath build-x86_64 \
            --specpath . \
            codex_switcher_macos.py
          ls -la dist-x86_64/

      - name: Verify architectures
        run: |
          echo "=== ARM64 ==="
          file dist-arm64/CodexSwitcher-M-chip
          echo "=== x86_64 ==="
          file dist-x86_64/CodexSwitcher-Intel

      - name: Upload M-chip artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexSwitcher-macOS-M-chip
          path: dist-arm64/
          retention-days: 30

      - name: Upload Intel artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexSwitcher-macOS-Intel
          path: dist-x86_64/
          retention-days: 30
