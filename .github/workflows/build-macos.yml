name: Build macOS (M-chip + Intel)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            suffix: "M芯片"
          - runner: macos-13
            suffix: "Intel"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pyinstaller pillow

      - name: Generate macOS icon
        run: |
          python3 generate_icon.py
          iconutil -c icns icon.iconset -o susu_icon.icns
          ls -la susu_icon.icns

      - name: Build with PyInstaller
        run: |
          pyinstaller \
            --onefile \
            --windowed \
            --name "CodexSwitcher-${{ matrix.suffix }}" \
            --icon susu_icon.icns \
            --distpath dist \
            --workpath build \
            --specpath . \
            codex_switcher_macos.py

      - name: List output
        run: |
          ls -la dist/
          find dist/ -type f -name "*.app" -o -name "*.app/*" | head -20

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CodexSwitcher-macOS-${{ matrix.suffix }}
          path: dist/
          retention-days: 30
